<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helm</title><meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #080808; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 200px; background: #0f0f0f; border-right: 1px solid #1a1a1a; padding: 24px 12px; display: flex; flex-direction: column; gap: 4px; }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; color: var(--primary); margin-bottom: 24px; padding-left: 12px; letter-spacing: -0.5px; transition: color 0.3s; }
  .logo img { width: 32px; height: 32px; border-radius: 8px; }
  .nav-btn { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: none; background: none; color: #555; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; text-align: left; transition: all 0.15s; }
  .nav-btn:hover { background: #1a1a1a; color: #fff; }
  .nav-btn.active { background: var(--primary-bg); color: var(--primary); }
  .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .main { margin-left: 200px; padding: 40px; min-height: 100vh; padding-bottom: 60px; }
  .page { display: none; }
  .page.active { display: block; }
  h1 { font-size: 28px; font-weight: 800; margin-bottom: 6px; }
  .subtitle { color: #555; font-size: 13px; margin-bottom: 32px; }
  .card { background: #111; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .input { background: #1a1a1a; border: none; border-radius: 10px; padding: 14px 16px; color: #fff; font-size: 15px; width: 100%; outline: none; margin-bottom: 12px; }
  .input::placeholder { color: #444; }
  .btn { background: var(--primary); border: none; border-radius: 10px; padding: 14px 24px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-sm { padding: 9px 16px; font-size: 13px; width: auto; border-radius: 8px; }
  .btn-outline { background: none; border: 1px solid #333; color: #888; }
  .btn-outline:hover { border-color: #555; color: #fff; background: #1a1a1a; }
  .btn-danger { background: #c0392b22; border: 1px solid #c0392b55; color: #c0392b; }
  .btn-danger:hover { background: #c0392b44; }
  .btn-installed { background: #27ae6022; border: 1px solid #27ae6055; color: #27ae60; cursor: default; }
  .connected-card { background: #111; border: 1px solid var(--primary-dim); border-radius: 16px; padding: 20px; margin-bottom: 24px; display: flex; align-items: center; gap: 16px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
  .device-info { flex: 1; }
  .device-name { font-size: 18px; font-weight: 700; }
  .device-ip { color: #555; font-size: 13px; margin-top: 2px; }
  .app-row { display: flex; align-items: center; background: #111; border-radius: 12px; padding: 14px; margin-bottom: 8px; gap: 14px; }
  .app-icon { font-size: 28px; flex-shrink: 0; }
  .app-info { flex: 1; }
  .app-name { font-size: 15px; font-weight: 600; }
  .app-desc { color: #555; font-size: 12px; margin-top: 3px; }
  .app-actions { display: flex; gap: 8px; align-items: center; flex-direction: column; min-width: 110px; }
  .progress-wrap { width: 100%; background: #1a1a1a; border-radius: 6px; height: 6px; overflow: hidden; display: none; }
  .progress-bar { height: 100%; background: var(--primary); border-radius: 6px; width: 0%; transition: width 0.3s; }
  .progress-label { font-size: 10px; color: #555; text-align: center; }
  .category-title { color: #444; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; margin-top: 24px; }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: var(--primary-bg); color: var(--primary); margin-top: 4px; }
  .bloat-row { display: flex; align-items: center; justify-content: space-between; background: #111; border-radius: 12px; padding: 14px 18px; margin-bottom: 8px; }
  .toggle { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #333; border-radius: 24px; cursor: pointer; transition: 0.2s; }
  .slider:before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: 0.2s; }
  input:checked + .slider { background: var(--primary); }
  input:checked + .slider:before { transform: translateX(20px); }
  .installed-row { display: flex; align-items: center; background: #111; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; gap: 12px; }
  .pkg-name { font-size: 14px; font-weight: 600; flex: 1; }
  .pkg-id { color: #333; font-size: 10px; margin-top: 2px; }
  .guide-card { display: flex; align-items: center; background: #111; border-radius: 14px; padding: 16px; margin-bottom: 10px; cursor: pointer; transition: background 0.15s; gap: 14px; }
  .guide-card:hover { background: #1a1a1a; }
  .guide-icon-box { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
  .step { background: #111; border-radius: 12px; padding: 16px; margin-bottom: 8px; cursor: pointer; }
  .step-header { display: flex; align-items: center; gap: 12px; }
  .step-num { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .step-body { display: none; padding: 12px 0 0 40px; color: #888; font-size: 13px; line-height: 1.6; }
  .step-body.open { display: block; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 14px 20px; font-size: 14px; font-weight: 500; z-index: 999; transform: translateY(100px); opacity: 0; transition: all 0.3s; max-width: 300px; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: #27ae6055; color: #27ae60; }
  .toast.error { border-color: #c0392b55; color: #c0392b; }
  .toast.info { border-color: var(--primary-dim); color: var(--primary); }
  .status-bar { background: #0f0f0f; border-top: 1px solid #1a1a1a; position: fixed; bottom: 0; left: 200px; right: 0; padding: 8px 24px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: #444; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #c0392b; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .filter-chip { padding: 7px 14px; border-radius: 20px; border: 1px solid #222; background: #111; color: #666; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .filter-chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .empty { color: #333; font-size: 14px; text-align: center; padding: 60px 0; }
  .loading { text-align: center; padding: 40px; color: #444; }
  .saved-device { display: flex; align-items: center; background: #111; border-radius: 12px; padding: 14px; margin-bottom: 8px; border-left: 3px solid var(--primary); gap: 12px; cursor: pointer; transition: background 0.15s; }
  .saved-device:hover { background: #1a1a1a; }
  :root { --primary: #2E86FF; --primary-bg: #2E86FF15; --primary-dim: #2E86FF44; }
</style>
</head>

function applyTheme(type) {
  const t = THEMES[type] || THEMES.unknown;
  document.documentElement.style.setProperty('--primary', t.primary);
  document.documentElement.style.setProperty('--primary-bg', t.bg);
  document.documentElement.style.setProperty('--primary-dim', t.dim);
}

function toast(msg, type='info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.className = 'toast', 3000);
}

function showPage(page, e) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  if (e && e.currentTarget) e.currentTarget.classList.add('active');
  if (page === 'apps' && currentIp) loadApps();
  if (page === 'bloatware') renderBloat();
  if (page === 'store') {
    document.getElementById('store-list').innerHTML = '<div class="loading">Checking installed apps...</div>';
    loadInstalledPackages().then(() => renderStore());
  }
  if (page === 'guides') renderGuides();
}

async function adb(command) {
  const res = await fetch(`${API}/adb`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ command: `adb -s ${currentIp}:5555 ${command}` })
  });
  const data = await res.json();
  return (data.output || '').trim();
}

async function loadInstalledPackages() {
  if (!currentIp) return;
  try {
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 8000));
    const fetch_pkgs = adb('shell pm list packages');
    const result = await Promise.race([fetch_pkgs, timeout]);
    installedPackages = result.split('\n')
      .map(l => l.replace('package:', '').replace(/\r/g, '').trim())
      .filter(l => l.length > 0 && !l.endsWith('.common') && !l.includes('overlay') && !l.includes('apkmirror') && !l.includes('amazon.tv.legal') && !l.includes('amazon.tv.settings') && !l.includes('amazon.tv.parental'));
  } catch(e) {
    installedPackages = [];
  }
}

async function loadInstalledThenStore() {
  await loadInstalledPackages();
  renderStore();
}

async function connect() {
  const ip = document.getElementById('ip-input').value.trim();
  if (!ip) { toast('Enter an IP address first', 'error'); return; }
  const btn = document.getElementById('connect-btn');
  btn.textContent = 'Connecting...';
  btn.disabled = true;
  try {
    await fetch(`${API}/adb`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ command: `adb connect ${ip}:5555` }) });
    await new Promise(r => setTimeout(r, 1500));
    currentIp = ip;
    const mfr = (await adb('shell getprop ro.product.manufacturer')).toLowerCase().trim();
    const model = (await adb('shell getprop ro.product.model')).trim();
    const brand = (await adb('shell getprop ro.product.brand')).toLowerCase().trim();
    const combined = mfr + ' ' + brand;
    let type = 'googletv';
    if (combined.includes('amazon')) type = 'firetv';
    let friendlyName = 'Android TV';
    for (const [key, val] of Object.entries(DEVICE_NAMES)) {
      if (combined.includes(key)) { friendlyName = val; break; }
    }
    if (model && model.length > 0 && !model.includes('unknown')) {
      friendlyName = friendlyName + ' · ' + model;
    }
    currentDeviceType = type;
    localStorage.setItem('lastIp', ip);
    localStorage.setItem('deviceType', type);
    savedDevices = savedDevices.filter(d => d.ip !== ip);
    savedDevices.unshift({ ip, name: friendlyName, type });
    localStorage.setItem('savedDevices', JSON.stringify(savedDevices));
    applyTheme(type);
    showConnected(friendlyName, ip);
    toast(`Connected to ${friendlyName}`, 'success');
    loadInstalledPackages();
  } catch(e) {
    toast('Connection failed — check IP and WiFi', 'error');
  }
  btn.textContent = 'Connect';
  btn.disabled = false;
}

function showConnected(name, ip) {
  document.getElementById('connect-view').style.display = 'none';
  document.getElementById('connected-view').style.display = 'block';
  const t = THEMES[currentDeviceType] || THEMES.unknown;
  document.getElementById('device-name').textContent = t.icon + ' ' + name;
  document.getElementById('device-ip').textContent = ip;
  document.getElementById('status-dot').style.background = '#27ae60';
  document.getElementById('status-text').textContent = `Connected · ${name} · ${ip}`;
}

function disconnect() {
  currentIp = '';
  currentDeviceType = 'unknown';
  installedPackages = [];
  applyTheme('unknown');
  document.getElementById('connect-view').style.display = 'block';
  document.getElementById('connected-view').style.display = 'none';
  document.getElementById('status-dot').style.background = '#c0392b';
  document.getElementById('status-text').textContent = 'Not connected to a device';
  renderSavedDevices();
}

async function reboot() {
  if (!confirm('Reboot the TV?')) return;
  await adb('reboot');
  toast('Rebooting...', 'info');
}

function renderSavedDevices() {
  const el = document.getElementById('saved-devices');
  if (!savedDevices.length) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="category-title">Recent Devices</div>' +
    savedDevices.map(d => {
      const dt = THEMES[d.type] || THEMES.unknown;
      return `<div class="saved-device" onclick="quickConnect('${d.ip}','${d.name}','${d.type}')">
        <span style="font-size:22px">${dt.icon}</span>
        <div><div style="font-weight:600;font-size:14px">${d.name}</div><div style="color:#555;font-size:12px">${d.ip}</div></div>
      </div>`;
    }).join('');
}

async function quickConnect(ip, name, type) {
  currentIp = ip;
  currentDeviceType = type;
  localStorage.setItem('lastIp', ip);
  localStorage.setItem('deviceType', type);
  applyTheme(type);
  try {
    await fetch(`${API}/adb`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ command: `adb connect ${ip}:5555` }) });
    showConnected(name, ip);
    toast(`Connected to ${name}`, 'success');
    loadInstalledPackages();
  } catch {
    toast('Connection failed', 'error');
  }
}

function renderStore() {
  const cats = [...new Set(STORE.map(a => a.category))];
  document.getElementById('store-filters').innerHTML =
    `<div class="filter-chip active" onclick="filterStore(null,this)">All</div>` +
    cats.map(c => `<div class="filter-chip" onclick="filterStore('${c}',this)">${c}</div>`).join('');
  renderStoreList(STORE);
}

function filterStore(cat, el) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderStoreList(cat ? STORE.filter(a => a.category === cat) : STORE);
}

function isInstalled(pkg) {
  return installedPackages.some(p => p === pkg);
}

function renderStoreList(apps) {
  document.getElementById('store-list').innerHTML = apps.map(app => {
    const installed = isInstalled(app.pkg);
    const key = app.name.replace(/\s/g,'_');
    return `
    <div class="app-row">
      <div class="app-icon">${app.icon}</div>
      <div class="app-info">
        <div class="app-name">${app.name} ${installed ? '<span style="color:#27ae60;font-size:11px">✓ Installed</span>' : ''}</div>
        <div class="app-desc">${app.desc}</div>
        <span class="tag">${app.category}</span>
      </div>
      <div class="app-actions">
        <button class="btn btn-sm ${installed ? 'btn-installed' : ''}"
          onclick="${installed ? '' : `installApp('${app.name}','${encodeURIComponent(app.url)}','${app.pkg}')`}"
          id="install-${key}"
          ${installed ? 'disabled' : ''}>
          ${installed ? '✓ Installed' : (currentIp ? 'Install' : 'Get')}
        </button>
        <div class="progress-wrap" id="progress-wrap-${key}">
          <div class="progress-bar" id="progress-${key}"></div>
        </div>
        <div class="progress-label" id="progress-label-${key}"></div>
      </div>
    </div>`;
  }).join('');
}

async function installApp(name, encodedUrl, pkg) {
  const url = decodeURIComponent(encodedUrl);
  if (!currentIp) { toast('Connect to a TV first!', 'error'); return; }
  const key = name.replace(/\s/g,'_');
  const btn = document.getElementById('install-' + key);
  const wrap = document.getElementById('progress-wrap-' + key);
  const bar = document.getElementById('progress-' + key);
  const label = document.getElementById('progress-label-' + key);

  btn.textContent = 'Starting...';
  btn.disabled = true;
  wrap.style.display = 'block';
  label.textContent = 'Downloading APK...';

  let prog = 0;
  const interval = setInterval(() => {
    if (prog < 55) { prog += 1.5; bar.style.width = prog + '%'; }
  }, 400);

  toast(`Installing ${name}...`, 'info');
  try {
    setTimeout(() => {
      label.textContent = 'Installing on TV...';
    }, 30000);

    const res = await fetch(`${API}/adb`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ install_url: url, ip: currentIp })
    });
    clearInterval(interval);
    const data = await res.json();

    if (data.error && data.error.includes('FAILED')) {
      bar.style.width = '100%';
      bar.style.background = '#c0392b';
      label.textContent = 'Install failed';
      toast(`${name} install failed — ${data.error}`, 'error');
    } else {
      bar.style.width = '100%';
      label.textContent = '✓ Installed!';
      installedPackages.push(pkg);
      toast(`${name} installed!`, 'success');
      setTimeout(() => renderStoreList(STORE), 1500);
    }
    setTimeout(() => { wrap.style.display = 'none'; bar.style.width = '0%'; bar.style.background = 'var(--primary)'; label.textContent = ''; }, 3000);
  } catch(e) {
    clearInterval(interval);
    toast('Install failed — check connection', 'error');
    wrap.style.display = 'none';
  }
  btn.textContent = currentIp ? 'Install' : 'Get';
  btn.disabled = false;
}

async function renderBloat() {
  if (!currentIp) {
    document.getElementById('bloat-list').innerHTML = '<div class="empty">Connect to a device first</div>';
    return;
  }
  const list = currentDeviceType === 'firetv' ? FIRETV_BLOAT : GOOGLETV_BLOAT;
  document.getElementById('bloat-list').innerHTML = '<div class="loading">Loading from TV...</div>';
  
  try {
    const result = await adb('shell pm list packages -d');
    const disabled = result.split('\n')
      .map(l => l.replace('package:', '').replace(/\r/g, '').trim())
      .filter(l => l.length > 0);
    
    document.getElementById('bloat-list').innerHTML = list.map(item => {
      const enabled = !disabled.includes(item.pkg);
      return `<div class="bloat-row">
        <div>
          <div style="font-weight:500;font-size:14px">${item.name}</div>
          <div style="color:#333;font-size:10px;margin-top:2px">${item.pkg}</div>
        </div>
        <label class="toggle">
          <input type="checkbox" ${enabled ? 'checked' : ''} onchange="toggleBloat('${item.pkg}',this.checked)">
          <span class="slider"></span>
        </label>
      </div>`;
    }).join('');
  } catch {
    document.getElementById('bloat-list').innerHTML = '<div class="empty">Failed to load from TV</div>';
  }
}

async function toggleBloat(pkg, enabled) {
  if (!currentIp) { toast('Connect first', 'error'); return; }
  const cmd = enabled ? `shell pm enable ${pkg}` : `shell pm disable-user --user 0 ${pkg}`;
  await adb(cmd);
  toast(enabled ? 'Enabled' : 'Disabled', 'info');
}

function disableAll() {
  if (!confirm('Disable all bloatware?')) return;
  const list = currentDeviceType === 'firetv' ? FIRETV_BLOAT : GOOGLETV_BLOAT;
  list.forEach(item => toggleBloat(item.pkg, false));
  setTimeout(renderBloat, 2000);
}

function formatAppName(pkg) {
  if (FRIENDLY_NAMES[pkg]) return FRIENDLY_NAMES[pkg];
  const parts = pkg.split('.').filter(p => !['com','org','tv','net','io','android','amazon','google'].includes(p));
  const raw = parts[parts.length - 1] || pkg;
  const name = raw.replace(/([A-Z])/g, ' $1').trim();
  return { name: name.charAt(0).toUpperCase() + name.slice(1), icon: '📱' };
}

async function loadApps() {
  document.getElementById('apps-list').innerHTML = '<div class="loading">Loading apps...</div>';
  try {
    const result = await adb('shell pm list packages -3');
    const pkgs = result.split('\n').map(l => l.replace('package:','').trim()).filter(l => l.includes('.'));
    document.getElementById('apps-subtitle').textContent = `${pkgs.length} sideloaded apps`;
    document.getElementById('apps-list').innerHTML = pkgs.length ? pkgs.map(pkg => {
      const { name, icon } = formatAppName(pkg);
      return `<div class="installed-row">
        <span style="font-size:22px">${icon}</span>
        <div style="flex:1"><div class="pkg-name">${name}</div><div class="pkg-id">${pkg}</div></div>
        <button class="btn btn-sm btn-danger" onclick="uninstallApp('${pkg}','${name}')">Remove</button>
      </div>`;
    }).join('') : '<div class="empty">No sideloaded apps found</div>';
  } catch {
    document.getElementById('apps-list').innerHTML = '<div class="empty">Failed to load apps</div>';
  }
}

async function uninstallApp(pkg, name) {
  if (!confirm(`Remove ${name}?`)) return;
  await adb(`shell pm uninstall --user 0 ${pkg}`);
  toast(`${name} removed`, 'success');
  loadApps();
}

}

function openGuideDetail(id) {
  const g = GUIDES.find(x => x.id === id);
  document.getElementById('guides-list').style.display = 'none';
  const detail = document.getElementById('guide-detail');
  detail.style.display = 'block';
  detail.innerHTML = `
    <button class="btn btn-sm btn-outline" onclick="renderGuides()" style="margin-bottom:20px">← Back</button>
    <h1>${g.icon} ${g.title}</h1>
    <p class="subtitle">${g.desc}</p>
    ${g.steps.map((s,i) => `
      <div class="step" onclick="toggleStep(${i})">
        <div class="step-header">
          <div class="step-num" style="background:${g.color}">${i+1}</div>
          <div style="flex:1;font-weight:500;font-size:14px">${s.title}</div>
          <span id="step-arrow-${i}" style="color:#555">▼</span>
        </div>
        <div class="step-body" id="step-body-${i}">${s.body}</div>
      </div>`).join('')}`;
}

function toggleStep(i) {
  const body = document.getElementById('step-body-' + i);
  const arrow = document.getElementById('step-arrow-' + i);
  body.classList.toggle('open');
  arrow.textContent = body.classList.contains('open') ? '▲' : '▼';
}
